name: Production CI & Quality Gates

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Typecheck, Unit Tests & Production Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nguhanh_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Prisma Client Generation & Schema Push
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/nguhanh_test_db?schema=public
        run: |
          npx prisma generate
          npx prisma db push

      - name: Typecheck
        run: npm run typecheck

      - name: Run Test Suite
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/nguhanh_test_db?schema=public
        run: npx vitest run

      - name: Production Build
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/nguhanh_test_db?schema=public
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
