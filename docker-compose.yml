version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nguhanh_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nguhanh_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nguhanh_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-nguhanh_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nguhanh_user} -d ${POSTGRES_DB:-nguhanh_db}']
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nguhanh_web
    restart: always
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-nguhanh_user}:${POSTGRES_PASSWORD:-nguhanh_secret_2026}@postgres:5432/${POSTGRES_DB:-nguhanh_db}?schema=public
      APP_URL: http://localhost:3000
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local
